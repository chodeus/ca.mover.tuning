# Caller that removes a pull request's test builds when it closes. Checks out nothing.
# Mechanics: .github/workflows/unraid-plugin-pr-cleanup.yml.

name: PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: write
    # Pin to a reviewed chodeus-ops commit.
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-pr-cleanup.yml@f10aaf9c2847bf783594cf5840a23932550c5717 # feat/unraid-plugin-pr-builds
    with:
      pr_number: ${{ github.event.pull_request.number }}
