# Caller that removes a pull request's test builds when it closes. Checks out nothing.
# Mechanics: .github/workflows/unraid-plugin-pr-cleanup.yml.

name: PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: write
    # Pin to a reviewed chodeus-ops commit.
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-pr-cleanup.yml@e861ccc454b34922f5dc6f8f050a0c5677e45577 # feat/unraid-plugin-pr-builds
    with:
      pr_number: ${{ github.event.pull_request.number }}
